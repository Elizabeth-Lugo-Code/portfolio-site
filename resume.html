<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elizabeth Lugo | Resume</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body data-page="resume">
        <header>
            <nav>
                <div class="logo"><a href="index.html">Elizabeth Lugo</a></div>
                <ul class="nav-links" id="nav-links"></ul>
                <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </header>

        <main>
            <section class="resume-intro">
                <h1 id="resume-name"></h1>
                <p class="resume-title" id="resume-title"></p>
                <p class="resume-location" id="resume-contact"></p>
                <div class="download-buttons">
                    <a href="assets/files/resume.pdf" download class="download-btn">Download PDF</a>
                    <a href="assets/files/resume.docx" download class="download-btn">Download .docx</a>
                </div>
            </section>

            <section class="resume-section">
                <h2>Summary</h2>
                <p id="resume-summary"></p>
            </section>

            <section class="resume-section">
                <h2>Core Skills</h2>
                <div class="skills-grid" id="resume-skills"></div>
            </section>

            <section class="resume-section">
                <h2>Web Development Projects</h2>
                <div id="resume-projects"></div>
            </section>

            <section class="resume-section">
                <h2>Work Experience</h2>
                <div id="resume-experience"></div>
            </section>

            <section class="resume-section">
                <h2>Additional Experience</h2>
                <div id="resume-additional"></div>
            </section>

            <section class="resume-section">
                <h2>Education</h2>
                <div id="resume-education"></div>
            </section>

            <section class="resume-section">
                <h2>Recognition</h2>
                <div id="resume-recognition"></div>
            </section>
        </main>

        <footer>
            <div id="footer-root"></div>
        </footer>

        <script src="js/site.js"></script>
        <script src="js/resume.js"></script>
    </body>
</html>
